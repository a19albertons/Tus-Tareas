# If you are interested in using Android with FastLane for publishing take a look at the Android-Fastlane template.

# Declaracion de stages

stages:
  - image
  - build
  - test
  - sign
  - limpieza


# Tiene que concordar con la versión de Java del gradle
image: docker:24

variables:

  # Nombre de la imagen temporal que se va a usar el CD/ID
  TEMP_IMAGE: $CI_REGISTRY_IMAGE/temp:$CI_PIPELINE_ID

  # ANDROID_COMPILE_SDK is the version of Android you're compiling with.
  # It should match compileSdkVersion.
  ANDROID_COMPILE_SDK: "36.1"

  # ANDROID_BUILD_TOOLS is the version of the Android build tools you are using.
  # It should match buildToolsVersion.
  ANDROID_BUILD_TOOLS: "36.0.0"

  # It's what version of the command line tools we're going to download from the official site.
  # Official Site-> https://developer.android.com/studio/index.html
  # There, look down below at the cli tools only, sdk tools package is of format:
  #        commandlinetools-os_type-ANDROID_SDK_TOOLS_latest.zip
  # when the script was last modified for latest compileSdkVersion, it was which is written down below
  ANDROID_SDK_TOOLS: "14742923"

# Packages installation before running script
imagenPreparacion:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile herramientas/Dockerfile
        --build-arg ANDROID_COMPILE_SDK=$ANDROID_COMPILE_SDK
        --build-arg ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS
        --build-arg ANDROID_SDK_TOOLS=$ANDROID_SDK_TOOLS
        --destination $TEMP_IMAGE



# Basic android and gradle stuff
# Check linting
lintDebug:
  interruptible: true
  image: $TEMP_IMAGE
  stage: build
  script:
    - chmod +x codigo/gradlew
    - cd codigo
    - ./gradlew -Pci --console=plain :app:lintProduccionDebug -PbuildDir=lint
  artifacts:
    paths:
      - codigo/app/lint/reports/lint-results-debug.html
    expose_as: "lint-report"
    when: always

# # Make Project
assembleDebug:
  interruptible: true
  image: $TEMP_IMAGE
  stage: build
  script:
    - cd codigo
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - codigo/app/build/outputs/



# Run all tests, if any fails, interrupt the pipeline(fail it)
Tests:
  needs: [lintDebug, assembleDebug]
  interruptible: true
  image: $TEMP_IMAGE
  stage: test
  script:
    - chmod +x codigo/gradlew
    - cd codigo
    
    # 2. Descargar la imagen del sistema (ARM es necesaria para emulación por software estable sin KVM)
    # - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-30;default;x86_64"
    
    # 3. Crear el dispositivo virtual (AVD) manualmente
    - echo "no" | avdmanager create avd -n "ci_device" -k "system-images;android-30;aosp_atd;x86_64" --force --device "pixel_2"
    
    # 4. Lanzar el emulador en segundo plano
    # -no-accel: Desactiva KVM y fuerza emulación por software
    # -no-window: No necesita entorno gráfico
    - $ANDROID_HOME/emulator/emulator -avd "ci_device" -no-window -no-audio -no-accel -no-boot-anim -gpu swiftshader_indirect -cores 4 -memory 4096 &
    
    # 5. Esperar a que el móvil arranque completamente
    - |
      echo "Esperando a que el emulador arranque (esto puede tardar 10-15 min en ARM sin KVM)..."
      adb wait-for-device
      # Bucle para verificar que el sistema ha terminado de cargar el escritorio
      while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
        echo "Cargando sistema..."
        sleep 15
      done
      echo "¡Dispositivo iniciado!"

    # 6. Comprobar que el movil esta listo para recibir comando ADB
    - |
      while [ "$(adb shell getprop dev.bootcomplete | tr -d '\r')" != "1" ]; do
        echo "Cargando envio de comandos ADB..."
        sleep 15
      done
      echo "¡Dispositivo iniciado!"

    
    # 7. Lanzar las pruebas contra el dispositivo ya arrancado y verificar resultados, si hay fallos, marcar el job como fallido
    - |
      ./gradlew -Pci --console=plain :app:connectedProduccionDebugAndroidTest :app:testResultsCollectionProduccionDebug
      TEST_XML=$(find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' | head -n 1)
      if [ -z "$TEST_XML" ]; then
        echo "No se encontraron resultados de tests instrumentados."
        exit 1
      fi
      if find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' -print0 | xargs -0 grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"'; then
        echo "Fallos encontrados en resultados de Android Test."
        exit 1
      fi

# Genera el APK de produccion firmada
assembleRelease:
  needs: [Tests]
  interruptible: true
  stage: sign
  image: $TEMP_IMAGE
  script:
    - chmod +x codigo/gradlew
    - cd codigo
    - ./gradlew assembleRelease
    # Ruta del APK generado sin firmar
    - RUTA_APK=$(find app/build/outputs/apk/produccion/release -name "*.apk" | head -n 1)
    # Obtener el jks en base 64 y guardarlo en un archivo temporal
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_FQDN --api-protocol $CI_SERVER_PROTOCOL
    - glab -R $CI_PROJECT_PATH securefile download 4 --path="./fichero.jks"
    # Comando para firmar el APK
    - |
      $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner \
      sign \
      --ks "fichero.jks" \
      --ks-pass pass:"${CI_KEYSTORE_PASSWORD}" \
      --ks-key-alias "${CI_KEY_ALIAS}" \
      --key-pass pass:"${CI_KEY_PASSWORD}" \
      --out app-signed.apk \
      "$RUTA_APK"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  artifacts:
    paths:
      - codigo/app-signed.apk
      

limpieza:
  stage: limpieza
  image: $TEMP_IMAGE
  when: always  # se ejecuta aunque falle el pipeline
  script:
    - |
      REPO_ID=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories?per_page=100" \
        | jq -r '.[] | select(.path == "'"$CI_PROJECT_PATH/temp"'") | .id')
      if [ -n "$REPO_ID" ]; then
        curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" -X DELETE "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags/$CI_PIPELINE_ID" || true
      else
        echo "No se encontró el repositorio de registro temporal para borrar con curl."
      fi