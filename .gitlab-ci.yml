# Run all tests, if any fails, interrupt the pipeline(fail it)
debugTests:
  # needs: [lintDebug, assembleDebug]
  interruptible: true
  stage: test
  script:
    - cd codigo
    # 1. Instalar dependencias necesarias y ADB
    - apt-get --quiet update && apt-get --quiet install --yes libpulse0 libglu1-mesa libnss3 libxcomposite1 libxcursor1 libasound2 libgl1 libqt5gui5 adb
    
    # 2. Descargar la imagen del sistema (ARM es necesaria para emulación por software estable sin KVM)
    # - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-30;default;x86_64"
    
    # 3. Crear el dispositivo virtual (AVD) manualmente
    - echo "no" | avdmanager create avd -n "ci_device" -k "system-images;android-30;aosp_atd;x86_64" --force --device "pixel_2"
    
    # 4. Lanzar el emulador en segundo plano
    # -no-accel: Desactiva KVM y fuerza emulación por software
    # -no-window: No necesita entorno gráfico
    - $ANDROID_HOME/emulator/emulator -avd "ci_device" -no-window -no-audio -no-accel -no-boot-anim -gpu swiftshader_indirect -cores 4 -memory 4096 &
    
    # 5. Esperar a que el móvil arranque completamente
    - |
      echo "Esperando a que el emulador arranque (esto puede tardar 10-15 min en ARM sin KVM)..."
      adb wait-for-device
      # Bucle para verificar que el sistema ha terminado de cargar el escritorio
      while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
        echo "Cargando sistema..."
        sleep 15
      done
      echo "¡Dispositivo listo para pruebas!"
    
    # 6. Lanzar las pruebas contra el dispositivo ya arrancado y verificar resultados, si hay fallos, marcar el job como fallido
    - |
      ./gradlew -Pci --console=plain :app:connectedProduccionDebugAndroidTest :app:testResultsCollectionProduccionDebug
      TEST_XML=$(find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' | head -n 1)
      if [ -z "$TEST_XML" ]; then
        echo "No se encontraron resultados de tests instrumentados."
        exit 1
      fi
      if find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' -print0 | xargs -0 grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"'; then
        echo "Fallos encontrados en resultados de Android Test."
        exit 1
      fi
