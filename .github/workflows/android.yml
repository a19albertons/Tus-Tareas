name: CI/CD Pipeline

# Configuración de eventos que disparan el workflow
on:
  push:
    branches: [Desarrollo, master]
    tags:
      - 'TusTareas-*'
  pull_request:
    branches: [Desarrollo]
    paths-ignore: ['**.md']

    # Variables de entorno para la configuración del SDK y JDK
env:
  ANDROID_COMPILE_SDK: "36.1"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_TOOLS: "14742923"
  JAVA_VERSION: "21"

jobs:
  # 1. Análisis del lint basico
  lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Configura Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Ejecuta el análisis de lint
      - name: Run Android Lint
        working-directory: codigo
        run: |
          chmod +x gradlew
          ./gradlew -Pci --console=plain :app:lintProduccionDebug -PbuildDir=lint

      # Sube el reporte de lint como artefacto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: codigo/app/lint/reports/lint-results-produccionDebug.html
          retention-days: 5

  # 2. Análisis de estilo de código con Ktlint
  ktlint-check:
    name: Ktlint Check
    runs-on: ubuntu-24.04
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Configura Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Ejecuta el análisis de ktlint
      - name: Run ktlintCheck
        working-directory: codigo
        run: |
          chmod +x gradlew
          ./gradlew -Pci --console=plain ktlintCheck

      # Sube el reporte de ktlint como artefacto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-report
          path: codigo/app/lint/reports/ktlint/
          retention-days: 5

  # 3. Compilación del APK de debug
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-24.04
    needs: [lint, ktlint-check]
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Configura Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Compila el APK de debug
      - name: Assemble Debug APK (pre-produccion)
        working-directory: codigo
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Sube el APK de debug como artefacto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: codigo/app/build/outputs/apk/pre-produccion/debug/app-pre-produccion-debug.apk
          retention-days: 5

  # 4. Compilación del apk normal
  assemble:
    name: Assemble Normal APK
    runs-on: ubuntu-24.04
    needs: [lint, ktlint-check]
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Configura Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Compila el APK normal
      - name: Assemble Normal APK
        working-directory: codigo
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Sube el APK normal como artefacto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: codigo/app/build/outputs/apk/release/app-release.apk
          retention-days: 5

  # 5. Ejecución de pruebas instrumentadas y unitarias
  tests:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: [assemble-debug, assemble]
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Habilitar KVM en el ejecutor para aceleración por hardware nativa
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Corre el emulador y ejecuta tus pruebas
      - name: Run Android instrumented & unit tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          working-directory: ./codigo
          script: |
            ./gradlew app:createProduccionDebugCoverageReport app:createProduccionDebugUnitTestCoverageReport
            
            # Tu lógica de verificación de fallos personalizada adaptada
            COMPROBACION_FALLIDA=false
            TEST_XML=$(find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' | head -n 1) || true
            if [ -z "$TEST_XML" ]; then
              echo "No se encontraron resultados de tests instrumentados."
            fi
            
            # Se añade -print0 en find y -0 en xargs para mayor robustez ante nombres de archivo
            if find app/build/outputs/androidTest-results/connected/debug/flavors -name 'TEST-*.xml' -print0 2>/dev/null | xargs -0 grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' 2>/dev/null; then
              echo "Fallos encontrados en resultados de Android Test."
              COMPROBACION_FALLIDA=true
            fi
            
            if find app/build/test-results -name 'TEST-*.xml' -print0 2>/dev/null | xargs -0 grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' 2>/dev/null; then
              echo "Fallos encontrados en test unitarios."
              COMPROBACION_FALLIDA=true
            fi
            
            if [ "$COMPROBACION_FALLIDA" = true ]; then
              echo "Al menos un tipo de test es fallido, marcando el job como fallido."
              exit 1
            fi

  # 6. Ensamblado y firmado del APK de release
  assemble-release:
    name: Assemble & Sign Release APK
    runs-on: ubuntu-24.04
    needs: [tests]
    # Se ejecuta en master o ante la presencia de un tag
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Configura JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'

      # Configura Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Descarga el keystore codificado en base64 desde los secretos y lo decodifica
      - name: Download base64-encoded keystore from secrets
        run: |
          echo "${{ secrets.CI_CD_KEYSTORE_BASE64 }}" | base64 -d > codigo/fichero.jks

      # Firma el apk de release con apksigner usando las credenciales almacenadas en los secretos
      - name: Assemble Release APK & Sign it with apksigner
        working-directory: codigo
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleProduccionRelease

          # Localizar el APK generado
          RUTA_APK=$(find app/build/outputs/apk/produccion/release -name "*.apk" | head -n 1)
          echo "Unsigned APK path: $RUTA_APK"

          # Firma del APK con apksigner
          "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner" \
            sign \
            --ks fichero.jks \
            --ks-pass "pass:${CI_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${CI_KEY_ALIAS}" \
            --key-pass "pass:${CI_KEY_PASSWORD}" \
            --out app-signed.apk \
            "$RUTA_APK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: codigo/app-signed.apk
          retention-days: 5

  # 7. Despliegue del APK firmado en GitHub Releases (solo para tags que comiencen con "TusTareas-")
  deploy:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [assemble-release]
    # Filtro corregido con sintaxis nativa de GitHub Actions
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'TusTareas-') 
    steps:
      # Configura checkout
      - uses: actions/checkout@v4

      # Descarga el apk firmado desde el job anterior
      - name: Download signed APK 
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./release-files

      # Actualiza el nombre de la versión en el archivo de cambios (cambios.md) con la versión extraída del tag
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"  # ej. "TusTareas-v1.0"
          VERSION_NAME=$(echo "$TAG" | sed 's/^TusTareas-//')
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      # Genera el changelog de la release y copia el APK firmado con un nombre que incluya la versión
      - name: Generate release changelog
        run: |
          if [ -f "./release-files/app-signed.apk" ]; then
            cp ./release-files/app-signed.apk "TusTareas-${{ steps.version.outputs.version }}.apk"
          fi

      #  Realiza la publicación de la release en GitHub con el APK firmado y el changelog
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TusTareas v${{ steps.version.outputs.version }}
          body_path: cambios.md
          files: |
            TusTareas-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}